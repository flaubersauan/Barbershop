<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Romerito Barbershop</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="dashboard-body">

<header class="dash-header">
    <h1 class="titulo">
        <i class="fa-solid fa-scissors"></i> Romerito Barbershop
    </h1>
</header>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<main class="dashboard-main">
    
    {% block content %}
    {% endblock %}
</main>

<nav class="nav-dashboard">
        <a href="{{ url_for('dashboard') }}" class="nav-item">
            <i class="fa-solid fa-clock"></i>
            Horários
        </a>

        <a href="{{ url_for('agendamento.perfil') }}" class="nav-item">
            <i class="fa-solid fa-user"></i>
            Meu Perfil
        </a>

        <a href="{{ url_for('agendamento.meu_agendamento') }}" class="nav-item">
            <i class="fa-solid fa-calendar-check"></i>
            Meu Agendamento
        </a>

        <a href="{{ url_for('agendamento.historico') }}" class="nav-item">
            <i class="fa-solid fa-list"></i>
            Histórico
        </a>
    </nav>
</body>
</html>
